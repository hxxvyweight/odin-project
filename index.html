<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <title>Odin Project</title>
</head> 

<body> 

<section class="top-section">

    <!-- Container For Header of Website -->
<header class="header-container">
    
    <div class="logo">Header Logo</div>
    
    <nav class="nav-links">
        <a href="#">Instagram</a>
        <a href="#">Soundcloud</a>
        <a href="#">Bandcamp</a>
    </nav>

</header>

<!--Hero Section -->
<hero class="hero-section">
    



    <hero-main-text class="hero-text">
    
    <h1>Welcome to HXXVYWEIGHT Grooves</h1>
    <p>Showcasing all my music and everything related</p>
    <button>View More</button>

        
    </hero-main-text>
    
    <!--Contains Image for Hero Section  -->
    <hero-image-container>
        
        <img id="hero-image" src="https://images.unsplash.com/photo-1632059368252-be6d65abc4e2?ixlib=rb-4.1.0&q=85&fm=jpg&crop=entropy&cs=srgb&dl=milad-fakurian-DjjaZybYx4I-unsplash.jpg" style="transform: rotate(180deg);">
       
    </hero-image-container>

</hero>


</section>

<discography>
    <main-text id="music-display-text">
        
        <h1>Latest Releases</h1>

    </main-text>
    
    <display class="music-display">


    </display>

</discography>

<cta-container>

<quote-container-text id="cta-text">

    <p>Heres my music</p>
    <p>HXXVYWEIGHT</p>

</quote-container-text>


</cta-container>



<!--Footer Section-->
<footer>

    HXXVYWEIGHT Grooves Project

</footer>

</body>

</html>
